<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .flash.success {
            color: green;
            font-weight: bold;
            margin: 10px 0;
        }

        .large-select {
            width: 100%;
            max-width: 375px;
            height: 40px;
            font-size: 16px;
            box-sizing: border-box;
            padding: 4px 8px;
        }

        .remove-btn {
            font-size: 20px;
            padding: 2px 6px;
            line-height: 1;
            border-radius: 4px;
        }

        #items-list .item-box {
            display: flex;
            align-items: center;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 8px;
            background: #fafafa;
            gap: 12px;
        }

        #items-list .remove-btn {
            margin-left: auto;
            background: #e74c3c;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        #items-section input {
            margin-right: 10px;
            margin-bottom: 10px;
            width: calc(20% - 10px);
            box-sizing: border-box;
        }

        @media (max-width: 600px) {
            #items-section input {
                width: calc(100% - 20px);
                margin-right: 0;
            }

            #items-list .item-box {
                flex-direction: column;
                align-items: flex-start;
            }

            #items-list .remove-btn {
                margin: 8px 0 0 auto;
            }

            nav ul {
                gap: 15px !important;
                flex-wrap: wrap;
            }

            nav li {
                flex: 0 1 auto;
            }
        }



        nav a:hover {
            text-decoration: underline;
            color: #ffcc00;
        }

        .form-container {
            display: none;

        }
    </style>
</head>

<body>

   <nav style="background-color: #9164c9; padding: 10px;">
  <ul style="list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 40px;">
    <li>
      <a href="{{ url_for('invoice_form') }}" style="color: white; text-decoration: none; font-weight: bold;">Invoice</a>
    </li>
    <li>
      <a href="{{ url_for('analytics') }}" style="color: white; text-decoration: none; font-weight: bold;">Analytics</a>
    </li>
    <li>
      <form method="post" action="{{ url_for('logout') }}" style="display: inline;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" style="min-height: 0; padding: 5px 2px; border: 0; background: transparent; color: white;">Logout</button>
      </form>
    </li>
  </ul>
</nav>




    <div class="container">
        <form method="POST" action="/select_form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h3>Select an Option</h3>
            <select id="formSelector" class="large-select" onchange="showForm()">
                <option value="">-- Select --</option>
                <option value="Add">Add Customer</option>
                <option value="Analytics">Analytics</option>
            </select>
        </form>

        <div id="Add" class="form-container">
            <h2>Add Customer</h2>
            <form id="addcustomer" method="post" action="/add">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="formSelector" value="Add">
                <label for="name">Customer Name</label>
                <input type="text" id="name" name="name" required>
                <label for="customer_type">Customer Type</label>
                <select id="customer_type" name="customer_type" required onchange="updateGstRequirement()">
                    <option value="business">GST-registered customer</option>
                    <option value="retail">Retail customer (no GST number)</option>
                </select>
                <label for="address_line_1">Address line 1</label>
                <input type="text" id="address_line_1" name="address_line_1" autocomplete="address-line1" required>
                <label for="address_line_2">Address line 2</label>
                <input type="text" id="address_line_2" name="address_line_2" autocomplete="address-line2">
                <label for="area_landmark">Area / Landmark</label>
                <input type="text" id="area_landmark" name="area_landmark">
                <label for="city_village_district">City / Village / District</label>
                <input type="text" id="city_village_district" name="city_village_district" autocomplete="address-level2" required>
                <label for="state">State</label>
                <input type="text" id="state" name="state" autocomplete="address-level1" required>
                <label for="pincode">Pincode</label>
                <input type="text" id="pincode" name="pincode" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{6}" maxlength="6" required>
                <label for="mobile">Mobile number</label>
                <input type="tel" id="mobile" name="mobile" autocomplete="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email">
                <label for="gst_number">GSTIN <span id="gst-help">(required for GST-registered customers)</span></label>
                <input type="text" id="gst_number" name="gst_number" maxlength="15" autocomplete="off">
                <button type="submit" formaction="/add">Add Customer to Database</button><br>
            </form>
        </div>















        <div id="Analytics" class="form-container">
            <form id="analysis" method="post" action="/analysis">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="formSelector" value="Analytics">
                <br>
                <label for="filterSelector"><strong>Select Filters:</strong></label>
                <select id="filterSelector" class="large-select" onchange="handleFilterChange()">
                    <option value="">-- Select --</option>
                    <option value="date">Date Range</option>
                    <option value="customer">Customer</option>
                    <option value="both">Both</option>
                </select><br><br>

                <!-- Date Filter -->
                <div id="date-filters" style="margin-bottom: 10px; display: none;">
                    <label for="datefrom">From:</label><br>
                    <input type="date" id="datefrom" name="datefrom" class="large-select">
                    <br>
                    <label for="dateto">To:</label><br>
                    <input type="date" id="dateto" name="dateto" class="large-select">
                </div>

                <!-- Customer Filter -->
                <div id="customer-filter" style="margin-bottom: 10px; display: none;">
                    <label for="customer_id">Customer</label><br>
                    <select name="customer_id" id="customer_id" class="large-select">
                        <option value="" disabled selected>Select Customer</option>
                        {% for c in customers %}
                        <option value="{{c.customer_id}}">
                            {{ "RETAIL" if c.customer_type == "retail" else c.gst_number }}: {{ c.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <!-- <button type="submit" formaction="/analysis">Apply Filters</button> -->
                <button type="submit" formaction="{{ url_for('analysis_pdf') }}">
                    Download PDF
                </button>
            </form>

        </div>
    </div>
    <br>



    <script>

        function showForm() {
            const selected = document.getElementById("formSelector").value;
            const forms = document.getElementsByClassName("form-container");

            // Hide all forms
            for (let i = 0; i < forms.length; i++) {
                forms[i].style.display = "none";
            }

            // Show selected form
            if (selected) {
                document.getElementById(selected).style.display = "block";
            }
        }





        function handleFilterChange() {
            const selected = document.getElementById("filterSelector").value;
            const dateFilters = document.getElementById("date-filters");
            const customerFilter = document.getElementById("customer-filter");

            // Hide all by default
            dateFilters.style.display = "none";
            customerFilter.style.display = "none";

            if (selected === "date") {
                dateFilters.style.display = "block";
            } else if (selected === "customer") {
                customerFilter.style.display = "block";
            } else if (selected === "both") {
                dateFilters.style.display = "block";
                customerFilter.style.display = "block";
            }
        }

        function updateGstRequirement() {
            const isRetail = document.getElementById("customer_type").value === "retail";
            const gstField = document.getElementById("gst_number");
            gstField.required = !isRetail;
            gstField.disabled = isRetail;
            if (isRetail) {
                gstField.value = "";
            }
        }
