name: Ping Supabase Every 6 Days
on:
  schedule:
    - cron: '30 21 */6 * *'  # 3:00 AM IST every 6 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: windows-latest

    env:
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

    steps:
      - name: Ping Supabase (raw curl)
        shell: cmd
        run: |
          echo Pinging Supabase endpoint...
          echo "Key length: ${#SUPABASE_API_KEY}"
          curl -i "https://iqiytljbybypssagzmoy.supabase.co/rest/v1/customer?select=gst&limit=1" ^
            -H "apikey: %SUPABASE_API_KEY%" ^
            -H "Authorization: Bearer %SUPABASE_API_KEY%"
