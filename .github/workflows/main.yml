name: Ping Supabase Every 6 Days

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"   
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ENDPOINT: "https://iqiytljbybypssagzmoy.supabase.co/rest/v1/customer?select=gst&limit=1"
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
    steps:
      - name: Debug
        shell: bash
        run: |
          echo "Key length: ${#SUPABASE_API_KEY}"

      - name: Ping Supabase
        shell: bash
        run: |
          echo "Pinging Supabase endpoint: $SUPABASE_ENDPOINT"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_API_KEY" \
            -H "Authorization: Bearer $SUPABASE_API_KEY" \
            "$SUPABASE_ENDPOINT")
          echo "Status code: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Ping failed"
            exit 1
          fi
          echo "Ping successful"


