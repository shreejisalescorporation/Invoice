name: Ping Supabase Every 6 Days

on:
  schedule:
    - cron: '30 21 */6 * *'  # 3:00 AM IST every 6 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: windows-latest

    env:
      SUPABASE_ENDPOINT: https://iqiytljbybypssagzmoy.supabase.co/rest/v1/customer?select=gst&limit=1
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

    steps:
      - name: Ping Supabase (CMD)
        shell: cmd
        run: |
          echo Pinging Supabase endpoint: %SUPABASE_ENDPOINT%
          for /f "usebackq tokens=*" %%I in (`curl -s -o NUL -w "%%{http_code}" "%SUPABASE_ENDPOINT%" -H "apikey: %SUPABASE_API_KEY%" -H "Authorization: Bearer %SUPABASE_API_KEY%"`) do set STATUS=%%I
          echo Status code: %STATUS%
          if "%STATUS%"=="200" (
            echo Ping successful
          ) else (
            echo Ping failed with status code %STATUS%
            exit /b 1
          )
