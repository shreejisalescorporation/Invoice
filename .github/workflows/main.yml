name: Ping Supabase Every 6 Days

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 */6 * *"
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ENDPOINT: "https://iqiytljbybypssagzmoy.supabase.co/rest/v1/customer?select=customer_id&limit=1"
      SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
    steps:
      - name: Ping Supabase
        shell: bash
        run: |
          response_file="$RUNNER_TEMP/supabase-response.json"
          echo "Pinging Supabase customer endpoint"
          STATUS=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            -H "apikey: $SUPABASE_API_KEY" \
            -H "Authorization: Bearer $SUPABASE_API_KEY" \
            "$SUPABASE_ENDPOINT") || {
              echo "Supabase request failed before receiving an HTTP status"
              exit 1
            }
          echo "Status code: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Ping failed. Supabase response body:"
            cat "$response_file"
            exit 1
          fi
          echo "Ping successful"


